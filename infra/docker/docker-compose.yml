# Full local stack for machines with Docker.
# Usage:  docker compose -f infra/docker/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: content_cal
      POSTGRES_USER: contentcal
      POSTGRES_PASSWORD: contentcal_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentcal -d content_cal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:

# With this stack, .env becomes:
#   DATABASE_URL=postgresql+asyncpg://contentcal:contentcal_dev_only@localhost:5432/content_cal
#   REDIS_URL=redis://localhost:6379/0
